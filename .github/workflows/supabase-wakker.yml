# Een gratis Supabase-project gaat na ongeveer een week zonder gebruik op pauze (bijvoorbeeld in de zomerstop).
# Deze taak doet elke drie dagen één klein verzoek, zodat de app en de kijklinks blijven werken.
# Let op: GitHub zet geplande taken uit als er 60 dagen niets in de repository is veranderd; je krijgt dan een mail om hem weer aan te zetten.
name: Supabase wakker houden
on:
  schedule: [{ cron: "17 6 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Klein verzoek aan de database
        run: |
          URL=$(grep -o 'supabaseUrl: *"[^"]*"' js/config.js | cut -d'"' -f2)
          KEY=$(grep -o 'supabaseAnonKey: *"[^"]*"' js/config.js | cut -d'"' -f2)
          [ -n "$URL" ] || { echo "Geen Supabase ingesteld"; exit 0; }
          curl -fsS -X POST "$URL/rest/v1/rpc/teamplanner_schema" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
